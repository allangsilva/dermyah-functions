# Local dev only. Not used for deployment (GCP App Engine has no container/db
# dependency on this file). Spins up a throwaway Firestore emulator for local backend
# testing so `yarn start-dev` never has to touch the real prod Firestore database.
services:
  firestore:
    image: mtlynch/firestore-emulator-docker
    container_name: dermyah-functions-firestore-dev
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_PROJECT_ID=dermyah-dev
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
